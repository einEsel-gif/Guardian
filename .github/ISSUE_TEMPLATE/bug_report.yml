name: Bug report
description: Report a reproducible problem with Guardian.
body:
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Include Guardian, Paper, Minecraft, Java, Fabric Loader, and Fabric API versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Describe the steps, expected result, and actual result.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove player data, private paths, IP addresses, and tokens before sharing.
      render: text
