name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test the Paper plugin
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Build and test the Fabric mod
        working-directory: client
        run: sh gradlew --no-daemon clean build
      - name: Upload plugin and mod
        uses: actions/upload-artifact@v4
        with:
          name: guardian
          if-no-files-found: error
          path: |
            target/guardian-paper-1.0.2.jar
            client/build/libs/guardian-client-1.0.2.jar
