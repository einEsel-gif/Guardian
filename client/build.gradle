plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}

version = '1.0.2'
group = 'de.einesel'

dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.162.0+26.3'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.yaml:snakeyaml:2.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach { options.release = 25 }
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
// Exercise the shipped server policy, not a duplicate list in the tests.
sourceSets.test.resources {
    srcDir '../src/main/resources'
    include 'config.yml'
}
test {
    useJUnitPlatform()
    def fixtureDir = providers.systemProperty('guardian.fixture.dir').orNull
    if (fixtureDir != null) systemProperty 'guardian.fixture.dir', fixtureDir
    def vanillaJar = providers.systemProperty('guardian.vanilla.jar').orNull
    if (vanillaJar != null) systemProperty 'guardian.vanilla.jar', vanillaJar
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

jar {
    from('../LICENSE') { rename { 'LICENSE_Guardian' } }
}
